# S3 through an IAM role (IRSA) instead of fixed keys.
mode: minimal
publicUrl: https://castra.example.com
secrets:
  generate: true
drawio:
  mode: none
storage:
  mode: external
  external:
    endpoint: https://s3.eu-west-1.amazonaws.com
  region: eu-west-1
  forcePathStyle: "false"
  s3:
    credentials: aws-default
serviceAccount:
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/castra-attachments
