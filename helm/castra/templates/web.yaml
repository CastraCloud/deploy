{{- $full := include "castra.fullname" . -}}
{{- $drawioBundled := eq .Values.drawio.mode "bundled" -}}
{{- $portalHost := or .Values.portal.host .Values.gateway.portalHostnames -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $full }}-web
  labels:
    {{- include "castra.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicas }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "castra.selector" (dict "root" . "component" "web") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "castra.labels" . | nindent 8 }}
        app.kubernetes.io/component: web
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "castra.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- include "castra.pullSecrets" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: {{ include "castra.image" (dict "img" .Values.image.web "root" .) | quote }}
          imagePullPolicy: {{ .Values.image.web.pullPolicy }}
          env:
            # Ingress or the Gateway ends TLS, so the proxy serves plain http on 8080 (no privileged port needed).
            - name: CASTRA_SITE_ADDRESS
              value: ":8080"
            - name: CASTRA_TLS_MODE
              value: "off"
            # Requests arrive through the ingress controller, so trust it for the client address.
            - name: CASTRA_TRUSTED_PROXIES
              value: {{ .Values.web.trustedProxies | quote }}
            - name: CASTRA_DRAWIO_PORT
              value: "8081"
            {{- if $portalHost }}
            # The portal's own host name, routed here by the ingress or gateway: the portal at the root of this port.
            - name: CASTRA_PORTAL_SUFFIX
              value: "-port"
            - name: CASTRA_PORTAL_PORT
              value: "8082"
            {{- end }}
            - name: API_UPSTREAM
              value: "{{ $full }}-api:8080"
            - name: COLLAB_UPSTREAM
              value: "{{ $full }}-collab:8080"
            - name: MAIL_IN_UPSTREAM
              value: "{{ $full }}-mail-in:8080"
            {{- if $drawioBundled }}
            - name: DRAWIO_UPSTREAM
              value: "{{ $full }}-drawio:8080"
            {{- end }}
            {{- if .Values.keycloak.enabled }}
            - name: IDP_UPSTREAM
              value: "{{ $full }}-keycloak:8080"
            {{- end }}
            # The page may frame itself (always), the Draw.io editor and anything listed in web.frameSrc.
            {{- with (join " " (compact (list (include "castra.drawioUrl" .) (.Values.web.frameSrc | default "")))) }}
            - name: FRAME_SRC
              value: {{ . | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: drawio
              containerPort: 8081
              protocol: TCP
            {{- if $portalHost }}
            - name: portal
              containerPort: 8082
              protocol: TCP
            {{- end }}
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 3
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.web.securityContext | nindent 12 }}
          volumeMounts:
            - name: caddy-data
              mountPath: /data
            - name: caddy-config
              mountPath: /config
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: caddy-data
          emptyDir: {}
        - name: caddy-config
          emptyDir: {}
        - name: tmp
          emptyDir: {}
      {{- include "castra.scheduling" . | nindent 6 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $full }}-web
  labels:
    {{- include "castra.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
  {{- with .Values.web.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.web.service.type }}
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
    {{- if $drawioBundled }}
    - name: drawio
      port: 8081
      targetPort: drawio
      protocol: TCP
    {{- end }}
    {{- if $portalHost }}
    - name: portal
      port: 8082
      targetPort: portal
      protocol: TCP
    {{- end }}
  selector:
    {{- include "castra.selector" (dict "root" . "component" "web") | nindent 4 }}
{{- if and .Values.web.podDisruptionBudget (gt (int .Values.web.replicas) 1) }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $full }}-web
  labels:
    {{- include "castra.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "castra.selector" (dict "root" . "component" "web") | nindent 6 }}
{{- end }}
