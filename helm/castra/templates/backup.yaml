{{- if .Values.backup.enabled }}
{{- $full := include "castra.fullname" . -}}
{{- $b := .Values.backup -}}
{{- $bundled := eq .Values.database.mode "bundled" -}}
{{- if and (not $bundled) (not $b.database.user) }}
{{- fail "backup.database.user is required with an external database: a role that can read every table (not castra_owner)." }}
{{- end }}
{{- if eq $b.target "s3" }}
{{- $_ := required "backup.s3.bucket is required when backup.target is s3" $b.s3.bucket }}
{{- end }}
{{- $claim := default (printf "%s-backups" $full) $b.pvc.existingClaim -}}
{{- if and (eq $b.target "pvc") (not $b.pvc.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $claim }}
  labels:
    {{- include "castra.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  {{- with $b.pvc.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $b.pvc.size }}
---
{{- end }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $full }}-backup
  labels:
    {{- include "castra.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
spec:
  schedule: {{ $b.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: {{ $b.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ $b.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            {{- include "castra.selector" (dict "root" . "component" "backup") | nindent 12 }}
        spec:
          restartPolicy: Never
          serviceAccountName: {{ include "castra.serviceAccountName" . }}
          automountServiceAccountToken: false
          {{- include "castra.pullSecrets" . | nindent 10 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
            seccompProfile:
              type: RuntimeDefault
          {{- if eq $b.target "s3" }}
          initContainers:
            {{- include "castra.backupDump" (dict "root" . "name" "dump" "dest" "/work" "mount" "work") | nindent 12 }}
          containers:
            - name: upload
              image: {{ $b.s3.image | quote }}
              command:
                - sh
                - -c
                - |
                  set -eu
                  dir=$(ls -d /work/castra-* | head -n 1)
                  aws s3 cp --recursive --only-show-errors "$dir" "s3://$BACKUP_BUCKET/$BACKUP_PREFIX/$(basename "$dir")/"
                  echo "Uploaded $(basename "$dir")"
              env:
                - name: HOME
                  value: /tmp
                - name: BACKUP_BUCKET
                  value: {{ $b.s3.bucket | quote }}
                - name: BACKUP_PREFIX
                  value: {{ $b.s3.prefix | quote }}
                - name: AWS_DEFAULT_REGION
                  value: {{ $b.s3.region | quote }}
                {{- with $b.s3.endpoint }}
                - name: AWS_ENDPOINT_URL
                  value: {{ . | quote }}
                {{- end }}
                - name: AWS_ACCESS_KEY_ID
                  {{- include "castra.sref" (dict "root" . "cfg" $b.s3.accessKey "k" "backup-s3-access-key" "hook" false) | nindent 18 }}
                - name: AWS_SECRET_ACCESS_KEY
                  {{- include "castra.sref" (dict "root" . "cfg" $b.s3.secretKey "k" "backup-s3-secret-key" "hook" false) | nindent 18 }}
              resources:
                {{- toYaml (default (dict "requests" (dict "cpu" "50m" "memory" "128Mi")) $b.resources) | nindent 16 }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: work
                  mountPath: /work
                - name: tmp
                  mountPath: /tmp
          {{- else }}
          containers:
            {{- include "castra.backupDump" (dict "root" . "name" "dump" "dest" "/backups" "mount" "backups" "keep" $b.keep) | nindent 12 }}
          {{- end }}
          volumes:
            - name: tmp
              emptyDir: {}
            {{- if eq $b.target "s3" }}
            - name: work
              emptyDir: {}
            {{- else }}
            - name: backups
              persistentVolumeClaim:
                claimName: {{ $claim }}
            {{- end }}
          {{- include "castra.scheduling" . | nindent 10 }}
{{- end }}
