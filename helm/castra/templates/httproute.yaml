{{- if .Values.gateway.enabled }}
{{- $full := include "castra.fullname" . -}}
{{- $parents := required "gateway.parentRefs is required when the gateway is enabled" .Values.gateway.parentRefs -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $full }}
  labels:
    {{- include "castra.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- toYaml $parents | nindent 4 }}
  hostnames:
    {{- toYaml (required "gateway.hostnames is required when the gateway is enabled" .Values.gateway.hostnames) | nindent 4 }}
  rules:
    - backendRefs:
        - name: {{ $full }}-web
          port: 80
      {{- with .Values.gateway.timeouts }}
      timeouts:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- if and (eq .Values.drawio.mode "bundled") .Values.gateway.drawioHostnames }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $full }}-drawio
  labels:
    {{- include "castra.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- toYaml $parents | nindent 4 }}
  hostnames:
    {{- toYaml .Values.gateway.drawioHostnames | nindent 4 }}
  rules:
    - backendRefs:
        - name: {{ $full }}-web
          port: 8081
{{- end }}
{{- $portalHosts := .Values.gateway.portalHostnames | default (compact (list .Values.portal.host)) }}
{{- if $portalHosts }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $full }}-portal
  labels:
    {{- include "castra.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- toYaml $parents | nindent 4 }}
  hostnames:
    {{- toYaml $portalHosts | nindent 4 }}
  rules:
    - backendRefs:
        - name: {{ $full }}-web
          port: 8082
{{- end }}
{{- end }}
