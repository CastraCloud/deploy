{{- if eq .Values.valkey.mode "bundled" }}
{{- $full := include "castra.fullname" . -}}
{{- $v := .Values.valkey -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $full }}-valkey
  labels:
    {{- include "castra.labels" . | nindent 4 }}
    app.kubernetes.io/component: valkey
spec:
  type: ClusterIP
  ports:
    - name: valkey
      port: 6379
      targetPort: valkey
  selector:
    {{- include "castra.selector" (dict "root" . "component" "valkey") | nindent 4 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $full }}-valkey
  labels:
    {{- include "castra.labels" . | nindent 4 }}
    app.kubernetes.io/component: valkey
spec:
  serviceName: {{ $full }}-valkey
  replicas: 1
  selector:
    matchLabels:
      {{- include "castra.selector" (dict "root" . "component" "valkey") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "castra.labels" . | nindent 8 }}
        app.kubernetes.io/component: valkey
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- include "castra.pullSecrets" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: valkey
          image: {{ $v.bundled.image | quote }}
          args: ["valkey-server", "--appendonly", "yes"]
          ports:
            - name: valkey
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            {{- toYaml $v.bundled.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
      {{- include "castra.scheduling" . | nindent 6 }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with $v.bundled.storage.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ $v.bundled.storage.size }}
{{- end }}
