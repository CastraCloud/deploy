{{- /*
  Works out every secret the chart manages once, then writes it twice: the normal Secret, and a copy for the migrate
  Job's hook (a pre-install hook runs before normal resources exist). A secret is not managed here when it names an
  existingSecret. Otherwise its value is, in order: the value in values.yaml, what the Secret already holds (so upgrades
  keep it), a new random one when secrets.generate is true. Without any of those it is an error where Castra needs it.
*/ -}}
{{- define "castra.pick" -}}
{{- if not .cfg.existingSecret -}}
{{- $val := .cfg.value | default "" -}}
{{- if and (not $val) (hasKey .ex .k) -}}{{- $val = index .ex .k | b64dec -}}{{- end -}}
{{- if and (not $val) .gen .root.Values.secrets.generate -}}{{- $val = randAlphaNum .len -}}{{- end -}}
{{- if and (not $val) .req -}}
{{- fail (printf "No value for %s. Set %s.existingSecret, or %s.value, or secrets.generate=true." .path .path .path) -}}
{{- end -}}
{{- if $val -}}{{- $_ := set .m .k $val -}}{{- end -}}
{{- end -}}
{{- end -}}

{{- $v := .Values -}}
{{- $ex := dict -}}
{{- $found := lookup "v1" "Secret" .Release.Namespace (include "castra.secretName" .) -}}
{{- if $found -}}{{- $ex = $found.data | default dict -}}{{- end -}}
{{- $m := dict -}}
{{- $p := dict "m" $m "ex" $ex "root" . -}}
{{- $signIn := include "castra.signIn" . -}}

{{- /* Database */ -}}
{{- include "castra.pick" (merge (dict "k" "db-owner-password" "cfg" $v.database.ownerPassword "gen" true "req" true "len" 40 "path" "database.ownerPassword") $p) -}}
{{- include "castra.pick" (merge (dict "k" "db-app-password" "cfg" $v.database.appPassword "gen" true "req" true "len" 40 "path" "database.appPassword") $p) -}}
{{- if eq $v.database.mode "bundled" -}}
{{- include "castra.pick" (merge (dict "k" "db-superuser-password" "cfg" $v.database.bundled.superuserPassword "gen" true "req" true "len" 40 "path" "database.bundled.superuserPassword") $p) -}}
{{- end -}}

{{- /* Sign-in */ -}}
{{- if $signIn -}}
{{- include "castra.pick" (merge (dict "k" "session-secret" "cfg" $v.signIn.session.secret "gen" true "req" true "len" 48 "path" "signIn.session.secret") $p) -}}
{{- if include "castra.oidcOn" . -}}
{{- include "castra.pick" (merge (dict "k" "oidc-client-secret" "cfg" $v.signIn.oidc.clientSecret "gen" $v.keycloak.enabled "req" true "len" 40 "path" "signIn.oidc.clientSecret") $p) -}}
{{- end -}}
{{- include "castra.pick" (merge (dict "k" "saml-signing-key" "cfg" $v.signIn.saml.signingKey "gen" false "req" false "len" 0 "path" "signIn.saml.signingKey") $p) -}}
{{- else -}}
{{- include "castra.pick" (merge (dict "k" "session-secret" "cfg" $v.signIn.session.secret "gen" false "req" false "len" 48 "path" "signIn.session.secret") $p) -}}
{{- end -}}
{{- include "castra.pick" (merge (dict "k" "webhook-encryption-key" "cfg" $v.webhooks.encryptionKey "gen" true "req" false "len" 48 "path" "webhooks.encryptionKey") $p) -}}

{{- /* Email */ -}}
{{- include "castra.pick" (merge (dict "k" "smtp-password" "cfg" $v.email.smtp.password "gen" false "req" false "len" 0 "path" "email.smtp.password") $p) -}}
{{- include "castra.pick" (merge (dict "k" "mail-oauth-microsoft-client-secret" "cfg" $v.email.oauth.microsoft.clientSecret "gen" false "req" false "len" 0 "path" "email.oauth.microsoft.clientSecret") $p) -}}
{{- include "castra.pick" (merge (dict "k" "mail-oauth-google-client-secret" "cfg" $v.email.oauth.google.clientSecret "gen" false "req" false "len" 0 "path" "email.oauth.google.clientSecret") $p) -}}
{{- include "castra.pick" (merge (dict "k" "mail-token-secret" "cfg" $v.email.tokenSecret "gen" false "req" false "len" 0 "path" "email.tokenSecret") $p) -}}
{{- include "castra.pick" (merge (dict "k" "push-private-key" "cfg" $v.push.privateKey "gen" false "req" false "len" 0 "path" "push.privateKey") $p) -}}
{{- include "castra.pick" (merge (dict "k" "imap-password" "cfg" $v.inboundEmail.imap.password "gen" false "req" false "len" 0 "path" "inboundEmail.imap.password") $p) -}}
{{- include "castra.pick" (merge (dict "k" "mail-in-webhook-secret" "cfg" $v.inboundEmail.webhook.secret "gen" $v.inboundEmail.webhook.enabled "req" $v.inboundEmail.webhook.enabled "len" 40 "path" "inboundEmail.webhook.secret") $p) -}}

{{- /* Metrics */ -}}
{{- if $v.metrics.enabled -}}
{{- include "castra.pick" (merge (dict "k" "metrics-token" "cfg" $v.metrics.token "gen" true "req" true "len" 40 "path" "metrics.token") $p) -}}
{{- end -}}

{{- /* Storage and cache */ -}}
{{- $bundledS3 := eq $v.storage.mode "bundled" -}}
{{- if ne ($v.storage.s3.credentials | default "keys") "aws-default" -}}
{{- include "castra.pick" (merge (dict "k" "s3-access-key" "cfg" $v.storage.accessKey "gen" $bundledS3 "req" true "len" 20 "path" "storage.accessKey") $p) -}}
{{- include "castra.pick" (merge (dict "k" "s3-secret-key" "cfg" $v.storage.secretKey "gen" $bundledS3 "req" true "len" 40 "path" "storage.secretKey") $p) -}}
{{- end -}}
{{- if eq $v.valkey.mode "external" -}}
{{- include "castra.pick" (merge (dict "k" "valkey-url" "cfg" $v.valkey.external.url "gen" false "req" true "len" 0 "path" "valkey.external.url") $p) -}}
{{- end -}}

{{- /* Bundled Keycloak */ -}}
{{- if $v.keycloak.enabled -}}
{{- include "castra.pick" (merge (dict "k" "keycloak-admin-password" "cfg" $v.keycloak.adminPassword "gen" true "req" true "len" 24 "path" "keycloak.adminPassword") $p) -}}
{{- include "castra.pick" (merge (dict "k" "keycloak-db-password" "cfg" $v.keycloak.databasePassword "gen" true "req" true "len" 40 "path" "keycloak.databasePassword") $p) -}}
{{- end -}}

{{- /* Backups */ -}}
{{- if and $v.backup.enabled (eq $v.backup.target "s3") -}}
{{- include "castra.pick" (merge (dict "k" "backup-s3-access-key" "cfg" $v.backup.s3.accessKey "gen" false "req" true "len" 0 "path" "backup.s3.accessKey") $p) -}}
{{- include "castra.pick" (merge (dict "k" "backup-s3-secret-key" "cfg" $v.backup.s3.secretKey "gen" false "req" true "len" 0 "path" "backup.s3.secretKey") $p) -}}
{{- end -}}
{{- if and $v.backup.enabled (eq $v.database.mode "external") -}}
{{- include "castra.pick" (merge (dict "k" "backup-db-password" "cfg" $v.backup.database.password "gen" false "req" true "len" 0 "path" "backup.database.password") $p) -}}
{{- end -}}

{{- if $m }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "castra.secretName" . }}
  labels:
    {{- include "castra.labels" . | nindent 4 }}
  annotations:
    # Kept when the release is removed, so the passwords still match the volumes that are left behind.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- range $k, $val := $m }}
  {{ $k }}: {{ $val | b64enc | quote }}
  {{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "castra.hookSecretName" . }}
  labels:
    {{- include "castra.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: {{ include "castra.migrateHook" . }}
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
type: Opaque
data:
  {{- range $k, $val := $m }}
  {{ $k }}: {{ $val | b64enc | quote }}
  {{- end }}
{{- end }}
