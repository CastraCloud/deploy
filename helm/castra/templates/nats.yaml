{{- if and (eq .Values.events.transport "nats") (eq .Values.nats.mode "bundled") }}
{{- $full := include "castra.fullname" . -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $full }}-nats
  labels:
    {{- include "castra.labels" . | nindent 4 }}
    app.kubernetes.io/component: nats
spec:
  type: ClusterIP
  ports:
    - name: client
      port: 4222
      targetPort: client
  selector:
    {{- include "castra.selector" (dict "root" . "component" "nats") | nindent 4 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $full }}-nats
  labels:
    {{- include "castra.labels" . | nindent 4 }}
    app.kubernetes.io/component: nats
spec:
  serviceName: {{ $full }}-nats
  replicas: 1
  selector:
    matchLabels:
      {{- include "castra.selector" (dict "root" . "component" "nats") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "castra.labels" . | nindent 8 }}
        app.kubernetes.io/component: nats
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- include "castra.pullSecrets" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nats
          image: {{ .Values.nats.image | quote }}
          args: ["-js", "-sd", "/data", "-m", "8222"]
          ports:
            - name: client
              containerPort: 4222
            - name: monitor
              containerPort: 8222
          readinessProbe:
            httpGet:
              path: /healthz
              port: monitor
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: monitor
            periodSeconds: 20
          resources:
            {{- toYaml .Values.nats.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
      {{- include "castra.scheduling" . | nindent 6 }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.nats.storage.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.nats.storage.size }}
{{- end }}
