{{- if eq .Values.previews.mode "bundled" }}
{{- $full := include "castra.fullname" . -}}
{{- $p := .Values.previews -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $full }}-previews
  labels:
    {{- include "castra.labels" . | nindent 4 }}
    app.kubernetes.io/component: previews
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3000
      targetPort: http
  selector:
    {{- include "castra.selector" (dict "root" . "component" "previews") | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $full }}-previews
  labels:
    {{- include "castra.labels" . | nindent 4 }}
    app.kubernetes.io/component: previews
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "castra.selector" (dict "root" . "component" "previews") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "castra.labels" . | nindent 8 }}
        app.kubernetes.io/component: previews
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- include "castra.pullSecrets" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gotenberg
          image: {{ $p.bundled.image | quote }}
          # Only the LibreOffice conversion is left: no fetching of addresses, no callbacks, no Chromium routes.
          args:
            - gotenberg
            - --api-disable-download-from
            - --webhook-disable
            - --chromium-disable-routes
            - --api-timeout={{ $p.timeoutSeconds }}s
            - --libreoffice-restart-after=50
          ports:
            - name: http
              containerPort: 3000
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            {{- toYaml $p.bundled.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
      {{- include "castra.scheduling" . | nindent 6 }}
{{- if $p.bundled.networkPolicy }}
---
# The converter takes files from the Castra server pods that make previews and sends nothing anywhere. This needs
# a network plugin that enforces NetworkPolicy (most do); without one it has no effect.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $full }}-previews
  labels:
    {{- include "castra.labels" . | nindent 4 }}
    app.kubernetes.io/component: previews
spec:
  podSelector:
    matchLabels:
      {{- include "castra.selector" (dict "root" . "component" "previews") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  egress: []
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: castra
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: {{ ternary "app" "preview" (eq .Values.mode "minimal") }}
      ports:
        - port: http
{{- end }}
{{- end }}
